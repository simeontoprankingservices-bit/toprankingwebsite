<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simeon Top Ranking · Local SEO for South African Tradespeople</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #080C18;
    --bg-2: #0B1120;
    --line: rgba(255,255,255,0.07);
    --line-strong: rgba(255,255,255,0.12);
    --text: #ffffff;
    --muted: #94A3B8;
    --dim: #64748B;
    --dimmer: #475569;
    --accent: #00AEEF;
    --accent-soft: rgba(0,174,239,0.10);
    --accent-line: rgba(0,174,239,0.28);
    --whatsapp: #25D366;
    --whatsapp-hover: #1EBE5C;
    --danger: #EF4444;
    --success: #22C55E;
    --warn: #F59E0B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  img { max-width: 100%; display: block; }

  /* ============ NAV ============ */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(8,12,24,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .logo { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .logo span { color: var(--accent); }
  .nav-links { display: none; gap: 28px; font-size: 13px; color: var(--muted); }
  .nav-links a:hover { color: var(--text); }
  .nav-btn {
    background: var(--accent); color: #fff;
    font-size: 12.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 8px;
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: filter .15s;
  }
  .nav-btn:hover { filter: brightness(1.08); }

  @media (min-width: 900px) {
    .nav { padding: 16px 48px; }
    .nav-links { display: flex; }
    .logo { font-size: 15px; }
  }

  /* ============ CONTAINER ============ */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 900px) { .wrap { padding: 0 48px; } }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    padding: 48px 0 56px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 400px at 50% -10%, rgba(0,174,239,0.10), transparent 60%),
      radial-gradient(600px 300px at 50% 110%, rgba(0,174,239,0.05), transparent 60%);
    pointer-events: none;
  }
  .hero-inner { position: relative; }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    color: var(--accent);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 100px;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 currentColor;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,174,239,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(0,174,239,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,174,239,0); }
  }

  .hero-h1 {
    font-size: clamp(34px, 6vw, 68px);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin-top: 22px;
    text-wrap: balance;
  }
  .hero-h1 .blue { color: var(--accent); }
  .hero-h1 .strike {
    position: relative; display: inline-block;
  }
  .hero-h1 .strike::after {
    content: ''; position: absolute;
    left: -2%; right: -2%; top: 56%;
    height: 0.08em; background: var(--danger);
    transform: rotate(-2deg);
    border-radius: 2px;
  }
  .hero-sub {
    font-size: clamp(15px, 1.6vw, 18px);
    color: var(--muted);
    line-height: 1.6;
    max-width: 560px;
    margin-top: 22px;
  }
  .hero-sub strong { color: var(--text); font-weight: 600; }

  .cta-row {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 14px; margin-top: 32px;
  }
  .wa-btn {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--whatsapp); color: #fff;
    font-size: 16px; font-weight: 700;
    padding: 16px 26px; border-radius: 12px;
    border: none; cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(37,211,102,0.5);
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  .wa-btn:hover { background: var(--whatsapp-hover); transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(37,211,102,0.6); }
  .wa-btn .ti { font-size: 22px; }

  .urgency {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--muted);
    background: rgba(239,68,68,0.06);
    border: 1px solid rgba(239,68,68,0.20);
    padding: 8px 14px; border-radius: 100px;
  }
  .urgency .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    animation: pulse-red 1.6s infinite;
  }
  @keyframes pulse-red {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.15); }
  }
  .urgency strong { color: #fff; font-weight: 700; }
  .urgency .countdown { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }

  /* HERO LAYOUT — A: Centered (default) */
  .hero.layout-centered .hero-inner { text-align: center; }
  .hero.layout-centered .hero-sub { margin-left: auto; margin-right: auto; }
  .hero.layout-centered .cta-row { align-items: center; }

  /* HERO LAYOUT — B: Split with mock SERP card */
  .hero.layout-split .hero-grid {
    display: grid; gap: 40px; align-items: center;
  }
  @media (min-width: 960px) {
    .hero.layout-split .hero-grid { grid-template-columns: 1.1fr 1fr; gap: 56px; }
  }

  /* HERO LAYOUT — C: Left aligned, full width */
  .hero.layout-left .hero-inner { text-align: left; }

  /* SERP MOCK */
  .serp-mock {
    background: #fff;
    color: #202124;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    font-family: 'Inter', sans-serif;
    max-width: 460px;
    margin: 0 auto;
  }
  .serp-bar {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid #dadce0; border-radius: 22px;
    padding: 8px 14px; font-size: 13px; color: #5f6368;
  }
  .serp-bar .ti { color: #5f6368; }
  .serp-tabs {
    display: flex; gap: 18px; margin-top: 12px;
    border-bottom: 1px solid #ebebeb; padding-bottom: 6px;
    font-size: 12px; color: #5f6368;
  }
  .serp-tabs span:first-child { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: -7px; }
  .map-pack {
    margin-top: 14px;
    border: 1px solid #ebebeb; border-radius: 10px; overflow: hidden;
  }
  .map-img {
    height: 90px;
    background:
      linear-gradient(135deg, #e8f0e8 0%, #d4e4d4 100%);
    position: relative;
  }
  .map-img::before, .map-img::after {
    content: ''; position: absolute;
    background: rgba(255,255,255,0.6);
  }
  .map-img::before { top: 30%; left: 10%; width: 60%; height: 1px; }
  .map-img::after { top: 60%; left: 20%; width: 50%; height: 1px; }
  .map-pin {
    position: absolute; width: 14px; height: 14px; border-radius: 50% 50% 50% 0;
    background: var(--danger); transform: rotate(-45deg);
    border: 2px solid #fff;
  }
  .map-pin.p1 { top: 30%; left: 28%; }
  .map-pin.p2 { top: 50%; left: 60%; }
  .map-pin.p3 { top: 65%; left: 38%; }
  .map-result {
    padding: 10px 12px; border-top: 1px solid #ebebeb;
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px;
  }
  .map-result:first-of-type { border-top: none; }
  .map-result.you { background: #fff7e6; }
  .map-result.you .map-name { color: #c2410c; }
  .map-name { font-weight: 600; color: #1a73e8; font-size: 13px; }
  .map-meta { color: #5f6368; font-size: 11px; margin-top: 2px; }
  .map-meta .stars { color: #fbbc04; }
  .you-tag {
    background: var(--warn); color: #fff;
    font-size: 9px; font-weight: 700; letter-spacing: .06em;
    padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase;
  }
  .arrow-callout {
    position: absolute; right: -8px; top: 30%;
    background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 6px 10px; border-radius: 8px;
    transform: rotate(4deg);
    box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .serp-mock-wrap { position: relative; }

  /* ============ STATS ============ */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat-cell {
    padding: 22px 16px; text-align: center;
    border-right: 1px solid var(--line);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-num { font-size: clamp(22px, 3vw, 30px); font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
  .stat-lbl { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.04em; line-height: 1.5; }
  @media (min-width: 700px) {
    .stat-cell { padding: 32px 24px; }
    .stat-lbl { font-size: 12.5px; }
  }

  /* ============ SECTIONS ============ */
  .section { padding: 64px 0; border-bottom: 1px solid var(--line); }
  @media (min-width: 900px) { .section { padding: 96px 0; } }

  .sec-head { max-width: 720px; margin-bottom: 40px; }
  .sec-head.center { margin-left: auto; margin-right: auto; text-align: center; }
  .sec-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .sec-label::before {
    content: ''; width: 18px; height: 1px; background: var(--accent);
  }
  .sec-head.center .sec-label { display: inline-flex; }
  .sec-h2 {
    font-size: clamp(26px, 3.6vw, 42px);
    font-weight: 800; line-height: 1.1;
    letter-spacing: -0.02em; text-wrap: balance;
  }
  .sec-h2 .blue { color: var(--accent); }
  .sec-p {
    font-size: clamp(15px, 1.4vw, 17px);
    color: var(--muted); line-height: 1.65;
    margin-top: 16px; max-width: 620px;
  }
  .sec-head.center .sec-p { margin-left: auto; margin-right: auto; }

  /* ============ PAIN GRID ============ */
  .pain-grid {
    display: grid; gap: 16px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 700px) { .pain-grid { grid-template-columns: repeat(3, 1fr); } }

  .pain-card {
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-radius: 14px; padding: 24px;
    transition: border-color .2s, transform .2s;
  }
  .pain-card:hover { border-color: var(--accent-line); transform: translateY(-2px); }
  .pain-icon-wrap {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(239,68,68,0.10);
    border: 1px solid rgba(239,68,68,0.25);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--danger); font-size: 22px;
    margin-bottom: 16px;
  }
  .pain-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
  .pain-desc { font-size: 14px; color: var(--dim); line-height: 1.6; }

  /* ============ CASE STUDIES ============ */
  .case-grid {
    display: grid; gap: 16px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 800px) { .case-grid { grid-template-columns: repeat(3, 1fr); } }

  .case-card {
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .2s, transform .2s;
  }
  .case-card:hover { border-color: var(--accent-line); transform: translateY(-2px); }
  .case-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .case-trade { font-size: 13px; font-weight: 700; }
  .case-area { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .case-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(34,197,94,0.10); color: var(--success);
    border: 1px solid rgba(34,197,94,0.25);
  }
  .case-body { padding: 22px; flex: 1; display: flex; flex-direction: column; }
  .rank-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-bottom: 22px;
  }
  .rank-pill {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px; text-align: center;
  }
  .rank-pill .label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .rank-pill .val { font-size: 18px; font-weight: 800; margin-top: 4px; }
  .rank-pill.before .val { color: var(--danger); }
  .rank-pill.after .val { color: var(--success); }
  .rank-arrow { color: var(--accent); font-size: 22px; }
  .case-metric {
    display: flex; align-items: baseline; gap: 6px;
    margin-top: auto;
    padding-top: 16px; border-top: 1px dashed var(--line);
  }
  .case-metric .num { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
  .case-metric .label { font-size: 13px; color: var(--muted); }
  .case-quote { font-size: 13px; color: var(--muted); line-height: 1.55; font-style: italic; margin-top: 14px; }

  /* ============ FAQ ============ */
  .faq-list { display: flex; flex-direction: column; gap: 12px; max-width: 820px; }
  .faq {
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-radius: 12px; overflow: hidden;
    transition: border-color .2s;
  }
  .faq[open] { border-color: var(--accent-line); }
  .faq summary {
    list-style: none; cursor: pointer;
    padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font-size: 15px; font-weight: 600;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary .chev {
    color: var(--accent); font-size: 20px;
    transition: transform .2s;
  }
  .faq[open] summary .chev { transform: rotate(180deg); }
  .faq-body {
    padding: 0 22px 20px;
    font-size: 14.5px; color: var(--muted); line-height: 1.65;
  }
  @media (min-width: 700px) {
    .faq summary { padding: 22px 26px; font-size: 16.5px; }
    .faq-body { padding: 0 26px 24px; }
  }

  /* ============ FINAL CTA ============ */
  .final-cta {
    padding: 80px 0 88px;
    text-align: center;
    position: relative;
    background:
      radial-gradient(700px 300px at 50% 0%, rgba(0,174,239,0.10), transparent 60%);
  }
  .final-h {
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900; line-height: 1.1;
    letter-spacing: -0.02em; text-wrap: balance;
    max-width: 720px; margin: 0 auto 18px;
  }
  .final-h .blue { color: var(--accent); }
  .final-sub {
    font-size: 15px; color: var(--muted);
    max-width: 520px; margin: 0 auto 32px;
    line-height: 1.6;
  }
  .offer-box {
    background: rgba(0,174,239,0.05);
    border: 1px solid var(--accent-line);
    border-radius: 16px; padding: 24px;
    max-width: 440px; margin: 0 auto 32px;
    text-align: left;
  }
  .offer-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
  }
  .offer-items { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .offer-items li { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #CBD5E1; }
  .check-circle {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(34,197,94,0.15);
    color: var(--success);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }

  /* ============ FOOTER ============ */
  .footer-bar {
    padding: 24px 20px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .footer-bar p { font-size: 12px; color: var(--dimmer); }

  /* ============ TWEAKS PANEL: hide overflow icon-text on iOS ============ */
  .ti { line-height: 1; }
</style>

</head>
